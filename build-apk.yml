name: Build Yanlis Defterim APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with: cmdline-tools-version: 12266719

      - name: Capacitor paketlerini kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Kamera iznini Android manifestine ekle
        run: node scripts/patch-android-manifest.mjs

      - name: Web dosyalarını Android projesine aktar
        run: npx cap sync android

      - name: Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yanlis-defterim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
